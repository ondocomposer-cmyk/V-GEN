<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tvRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tvBg)" stroke="#e11d48" stroke-width="2.5"/>
  <!-- Top Red Accent Bar -->
  <rect x="4" y="4" width="56" height="15" rx="10" fill="url(#tvRed)"/>
  <!-- Live Indicator Dot -->
  <circle cx="12" cy="11.5" r="3" fill="#ffffff"/>
  <!-- Top Label: TV -->
  <text x="20" y="14.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" letter-spacing="1">ЭФИР</text>
  <!-- Main TVT Text -->
  <text x="32" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">ТВТ</text>
  <!-- Bottom Cyan Bar -->
  <rect x="14" y="50" width="36" height="4" rx="2" fill="#38bdf8"/>
</svg>
